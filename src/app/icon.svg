<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Three ascending bars — the same single-hue form the app uses for its own
    category and daily charts, which is the one mark that still reads at 16px
    where a letter turns to mush.

    The tile is opaque and always dark: a favicon sits on browser chrome of
    unknown colour, so a transparent gold mark would disappear against a light
    toolbar, and iOS drops the alpha channel outright.

    The bars are a lighter tint of the app's gold. #a16207 on #1a1a1c is only
    3.5:1 — fine for a chart bar the eye can dwell on, muddy for a 16px icon.
    This tint is 7.7:1 against the same tile.
  -->
  <rect width="32" height="32" rx="7" fill="#1a1a1c"/>
  <g fill="#d9a441">
    <rect x="6.5" y="17.5" width="5" height="8" rx="1.5"/>
    <rect x="13.5" y="13" width="5" height="12.5" rx="1.5"/>
    <rect x="20.5" y="7" width="5" height="18.5" rx="1.5"/>
  </g>
</svg>
